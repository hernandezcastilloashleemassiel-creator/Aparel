<div class="main">
    <h1>Proveedores</h1>
    
    <!--buscador-->
    <div class="buscador-acciones">
    <div class="buscador">
        <input type="text" placeholder="Buscar proveedor...">
        <button><i class="fi fi-rs-search"></i></button>
    </div>  
    </div>
    <!-- Contenido principal Proveedores -->
 <table class="tabla-proveedores">
    <thead>
        <tr>
            <th>Empresa</th>
            <th>Vendedor</th>
            <th>Correo Electrónico</th>
            <th>Teléfono</th>
            <th>Dirección</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
        <!--BtnModal-->
        <div class="btn-modal">
            <label for="Modal">
                Agregar Proveedor
            </label>
            <!--PantallaModal-->
            <input type="checkbox" id="Modal">
            <div class="contenedor-modal">
                <div class="contenido-modal">
                    <div class="btn-cerrar">
                    <label for="Modal">X</label>
                </div>
                    <h3>Agregar Proveedor</h3>
                    <form id="formProveedor">
                    <input type="hidden" id="IdProveedor" name="IdProveedor">
                    <input type="text" id="NombreEmpresa" name="NombreEmpresa" placeholder="Empresa">
                    <input type="text" id="Vendedor" name="Vendedor" placeholder="Vendedor">  
                    <input type="number" id="Telefono" name="Telefono" placeholder="Telefono ">
                    <input type="text" id="Correo" name="Correo" placeholder="Correo">
                    <input type="text" id="Direccion" name="Direccion" placeholder="Direccion">
                    <select id="Estado" name="Estado">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                    <button type="submit" id="btnagregarProveedor" class="btn"> Agregar Proveedor</button>
                    </form>
                </div>
            </div>
        </div>
            <tbody id="tabla-Proveedor"></tbody>
            <script type="module" src ="Proveedores.js"></script>
</table>
</div>
