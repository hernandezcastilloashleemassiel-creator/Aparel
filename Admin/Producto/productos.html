<div class="main">
    <h1>Productos</h1>
    
    <!--buscador-->
    <div class="buscador-acciones">
    <div class="buscador">
        <input type="text" placeholder="Buscar producto...">
        <button><i class="fi fi-rs-search"></i></button>
    </div>
    </div>
    <!-- Contenido principal Productos -->
 <table class="tabla-productos">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Categoría</th>
            <th>Stock</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <!--BtnModal-->
        <div class="btn-modal">
            <label for="Modal">
                Agregar Producto
            </label>
            <!--PantallaModal-->
            <input type="checkbox" id="Modal">
            <div class="contenedor-modal">
                <div class="contenido-modal">
                    <div class="btn-cerrar">
                    <label for="Modal">X</label>
                </div>
                    <h3>Agregar Producto</h3>
                    <form id="formProducto">
                    <input type="hidden" id="IdProducto" name="IdProducto">
                    <input type="text" id="NombreProducto" name="NombreProducto" placeholder="Nombre del producto">
                    <input type="text" id="DescripcionProducto" name="DescripcionProducto" placeholder="Descripcion Producto">
                    <input type="number" id="PrecioProducto" name="PrecioProducto" placeholder="Precio">
                    <input type="number" id="Stock" name="Stock" placeholder="Stock">
                    <select type="text" id="Categoria" name="Categoria" placeholder="Categoría">
                         <option value="">-- Seleccione una categoría --</option>
                    </select>
                    <select id="EstadoCategoria" name="EstadoCategoria">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                    <button type="submit" id="btnagregarproducto" class="btn"> Agregar producto</button>
                    </form>
                </div>
            </div>
        </div>
            <tbody id="tabla-Producto"></tbody>

</table>
</div>
<script src="/Admin/Producto/Productos.js" defer></script>
<script src="/Auth/verificarSesion.js"></script>
