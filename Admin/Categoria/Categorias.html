<div class="main">
    <h1>Categorías</h1>
    
    <!--buscador-->
    <div class="buscador-acciones">
    <div class="buscador">
        <input type="text" placeholder="Buscar categoría...">
        <button><i class="fi fi-rs-search"></i></button>
    </div>
    </div>
    <!-- Contenido principal Categorías -->
 <table class="tabla-categorias">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Acciones</th>

        </tr>
    </thead>
    <!--BtnModal-->
        <div class="btn-modal">
            <label for="Modal">
                Agregar Categoría
            </label>
            <!--PantallaModal-->
            <input type="checkbox" id="Modal">
            <div class="contenedor-modal">
                <div class="contenido-modal">
                    <div class="btn-cerrar">
                    <label for="Modal">X</label>
                </div>
                    <h3>Agregar Categoría</h3>
                    <form id="formCategoria">
                    <input type="hidden" id="IdCategoria" name="IdCategoria">
                    <input type="text" id="NombreCategoria" name="NombreCategoria" placeholder="Nombre de la categoría">
                    <input type="text" id="DescripcionCategoria" name="DescripcionCategoria" placeholder="Descripción de la categoría">
                    <select id="EstadoCategoria" name="EstadoCategoria">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                    <button type="submit" id="btnagregarcategoria" class="btn"> Agregar Categoría</button>
                    </form>
                </div>
            </div>
        </div>
            <tbody id="tabla-categorias"></tbody>
</table>
</div>
