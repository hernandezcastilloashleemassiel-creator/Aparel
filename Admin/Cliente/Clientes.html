<div class="main">
    <h1>Clientes</h1>
    
    <!--buscador-->
    <div class="buscador-acciones">
    <div class="buscador">
        <input type="text" placeholder="Buscar cliente...">
        <button><i class="fi fi-rs-search"></i></button>
    </div>
     <div class="acciones">
    </div>  
    </div>
    <!-- Contenido principal Clientes -->
 <table class="tabla-Clientes">
    <thead>
        <tr>
            <th>Nombre</th>
            <TH>Apellido</TH>
            <th>Correo Electrónico</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
        <!--BtnModal-->
        <div class="btn-modal">
            <label for="Modal">
                Agregar Clientes
            </label>
            <!--PantallaModal-->
            <input type="checkbox" id="Modal">
            <div class="contenedor-modal">
                <div class="contenido-modal">
                    <div class="btn-cerrar">
                    <label for="Modal">X</label>
                </div>
                    <h3>Agregar Clientes</h3>
                    <form id="formCliente">
                    <input type="hidden" id="IdClientes" name="IdClientes">
                    <input type="text" id="NombreCliente" name="NombreCliente" placeholder="Nombre">
                    <input type="text" id="ApellidoCliente" name="ApellidoCliente" placeholder="Apellido">  
                    <input type="text" id="CorreoCliente" name="CorreoCliente" placeholder="Correo ">
                    <input type="text" id="TelefonoCliente" name="TelefonoCliente" placeholder="Telefono ">
                    <select id="EstadoCliente" name="EstadoCliente">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                    <button type="submit" id="btnagregarclientes" class="btn"> Agregar Cliente</button>
                    </form>
                </div>
            </div>
        </div>
            <tbody id="tabla-Clientes"></tbody>
</table>
</div>
