<div class="contenedor-principal">

    <div class="tabla-productos">

            <thead>
        <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio und</th>
            <th>Cantidad</th>
            <th>Total</th>
            <th>Acciones</th>
        </tr>
    </thead>
        <!--BtnModal-->
        <div class="btn-modal">
            <label for="Modal">
                Agregar Producto
            </label>
            <!--PantallaModal-->
            <input type="checkbox" id="Modal">

                <div class="contenido-modal">
                    <div class="btn-cerrar">

                </div>

                        <option value="Camisetas"> Camisetas</option>
                        <option value="Pantalon"> Pantalon</option>
                        <option value="Vestido"> Vestido</option>
                        <option value="Blusa"> Blusa</option>
                        <option value="Gorra">Gorra</option>
                    </select>
                    <input type="number" id="precioundProducto" placeholder="Preciound">
                    <input type="number" id="cantidadProducto" placeholder="Cantidad">
                    
              <button id="btnagregarproducto" class="btn">Agregar Producto</button>
                </div>
            </div>
        </div>

 <div class="tipodepago">
